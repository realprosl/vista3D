<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250">
  <!--
    ALZADO SUR - fachada 10m x 2.5m. Origen abajo-izquierda.
    Aperturas:
      - 2 ventanas 120x120cm con antepecho 90cm.
    Simetrica: ventanas a 200cm del borde y a 200cm del otro borde.
  -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#333" stroke-width="4"/>
  <line x1="0" y1="248" x2="1000" y2="248" stroke="#333" stroke-width="2"/>

  <!-- Ventana 1 -->
  <rect x="200" y="90" width="120" height="120" fill="#cce4ff" stroke="#5a3a1a" stroke-width="3"/>
  <line x1="260" y1="90" x2="260" y2="210" stroke="#5a3a1a" stroke-width="1.5"/>
  <line x1="200" y1="150" x2="320" y2="150" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- Ventana 2 -->
  <rect x="680" y="90" width="120" height="120" fill="#cce4ff" stroke="#5a3a1a" stroke-width="3"/>
  <line x1="740" y1="90" x2="740" y2="210" stroke="#5a3a1a" stroke-width="1.5"/>
  <line x1="680" y1="150" x2="800" y2="150" stroke="#5a3a1a" stroke-width="1.5"/>

  <text x="260" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">V1 120×120cm</text>
  <text x="740" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">V2 120×120cm</text>
  <line x1="1010" y1="0" x2="1010" y2="250" stroke="#888" stroke-width="1"/>
  <text x="1018" y="125" font-family="sans-serif" font-size="14" fill="#666">250 cm</text>
</svg>
