<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>vista3D - Visor</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.9); padding: 10px 14px;
      border-radius: 6px; font-size: 13px; color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #info h2 { margin: 0 0 6px; font-size: 14px; }
    #info p { margin: 2px 0; }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 20px 30px; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      max-width: 480px; text-align: center;
    }
    #error h1 { color: #c33; margin: 0 0 8px; }
    canvas { display: block; }
    #back {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255,255,255,0.9); padding: 8px 14px;
      border-radius: 6px; font-size: 13px; color: #333;
      text-decoration: none; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #back:hover { background: #fff; color: #2a7ae2; }
    /* Icono de ayuda + tooltip */
    #help {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      background: #2a7ae2; color: white;
      border-radius: 50%;
      font-size: 13px; font-weight: 700;
      cursor: help; user-select: none;
      margin-left: 4px;
      transition: background 0.15s;
    }
    #help:hover, #help:focus { background: #1d5dbf; outline: none; }
    #help-tooltip {
      position: absolute; top: 100%; left: 0;
      margin-top: 8px;
      background: #222; color: #fff;
      padding: 10px 14px; border-radius: 6px;
      font-size: 12px; line-height: 1.5;
      width: 220px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      opacity: 0; visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
      z-index: 10;
      pointer-events: none;
    }
    #help-tooltip::before {
      content: ""; position: absolute; top: -6px; left: 16px;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 6px solid #222;
    }
    #help-tooltip ul { margin: 4px 0 0; padding-left: 18px; }
    #help-tooltip li { margin: 2px 0; }
    #help:hover + #help-tooltip,
    #help:focus + #help-tooltip,
    #help-tooltip:hover {
      opacity: 1; visibility: visible;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>Vista 3D</h2>
    <p id="dims">Cargando...</p>
    <span id="help" tabindex="0" aria-label="Ayuda de navegación">ⓘ</span>
    <div id="help-tooltip" role="tooltip">
      <strong>Cómo mover la vista</strong>
      <ul>
        <li><b>Arrastrar</b> (botón izquierdo) — rotar</li>
        <li><b>Scroll</b> — zoom</li>
        <li><b>Click derecho + arrastrar</b> — mover</li>
      </ul>
    </div>
  </div>
  <a id="back" href="/" title="Volver a la página de inicio">← Volver</a>
  <div id="error" style="display:none">
    <h1>Error</h1>
    <p id="err-msg"></p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/public/viewer.js"></script>
</body>
</html>
