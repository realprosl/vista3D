<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>vista3D - Visor</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.9); padding: 10px 14px;
      border-radius: 6px; font-size: 13px; color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #info h2 { margin: 0 0 6px; font-size: 14px; }
    #info p { margin: 2px 0; }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 20px 30px; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      max-width: 480px; text-align: center;
    }
    #error h1 { color: #c33; margin: 0 0 8px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">
    <h2>Vista 3D</h2>
    <p>Arrastra para rotar, scroll para zoom, click derecho para mover.</p>
    <p id="dims">Cargando...</p>
  </div>
  <div id="error" style="display:none">
    <h1>Error</h1>
    <p id="err-msg"></p>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/public/viewer.js"></script>
</body>
</html>
