<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>vista3D - Visor</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    /* Panel superior izquierdo: nombre + dims + icono info */
    #info {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.92); padding: 10px 14px;
      border-radius: 6px; font-size: 13px; color: #222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      z-index: 10;
    }
    #info h2 { margin: 0 0 6px; font-size: 14px; }
    #info p { margin: 2px 0; }

    /* Panel de controles (esquina inferior izquierda): toggles */
    #controls {
      position: absolute; bottom: 16px; left: 16px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 10;
    }
    .toggle {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.92);
      color: #222;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 6px;
      font: inherit; font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: background 0.15s, transform 0.1s;
    }
    .toggle:hover { background: #fff; }
    .toggle:active { transform: scale(0.97); }
    .toggle .indicator {
      width: 28px; height: 16px;
      background: #ccc; border-radius: 999px;
      position: relative; flex-shrink: 0;
      transition: background 0.15s;
    }
    .toggle .indicator::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 12px; height: 12px; background: white;
      border-radius: 50%;
      transition: transform 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .toggle.on .indicator { background: #2a7ae2; }
    .toggle.on .indicator::after { transform: translateX(12px); }
    .toggle svg { width: 14px; height: 14px; }

    /* Boton volver */
    #back {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255,255,255,0.92); padding: 8px 14px;
      border-radius: 6px; font-size: 13px; color: #222;
      text-decoration: none; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 10;
    }
    #back:hover { background: #fff; color: #2a7ae2; }

    /* Error modal */
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 20px 30px; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      max-width: 480px; text-align: center;
      z-index: 20;
    }
    #error h1 { color: #c33; margin: 0 0 8px; }
    canvas { display: block; }

    /* Icono ayuda con tooltip (USANDO PARENT RELATIVE) */
    /* El truco: el tooltip es hijo de #help-wrapper, que es position:relative.
       Asi el tooltip se posiciona respecto al icono y no salta a otro lado. */
    .help-wrapper {
      position: relative; display: inline-block;
      margin-left: 4px; vertical-align: middle;
    }
    #help {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px;
      background: #2a7ae2; color: white;
      border-radius: 50%;
      font-size: 13px; font-weight: 700;
      cursor: help; user-select: none;
      transition: background 0.15s;
    }
    #help:hover, #help:focus { background: #1d5dbf; outline: none; }
    #help-tooltip {
      position: absolute; top: calc(100% + 8px); left: -90px;
      background: #222; color: #fff;
      padding: 10px 14px; border-radius: 6px;
      font-size: 12px; line-height: 1.5;
      width: 220px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      opacity: 0; visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.15s, transform 0.15s, visibility 0.15s;
      z-index: 11;
      pointer-events: none;
    }
    #help-tooltip::before {
      content: ""; position: absolute; top: -6px; left: 96px;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 6px solid #222;
    }
    #help-tooltip ul { margin: 4px 0 0; padding-left: 18px; }
    #help-tooltip li { margin: 2px 0; }
    /* Mostrar al hover O focus del icono (no del tooltip, que tiene
       pointer-events:none). Asi el tooltip se cierra al salir del icono. */
    .help-wrapper:hover #help-tooltip,
    .help-wrapper:focus-within #help-tooltip {
      opacity: 1; visibility: visible;
      transform: translateY(0);
    }

    /* Panel de materiales flotante (esquina superior derecha). */
    #materials-panel {
      position: absolute; top: 16px; right: 16px; z-index: 5;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .mp-btn {
      width: 40px; height: 40px; padding: 0; border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px; background: rgba(255,255,255,0.92);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      cursor: pointer; color: #1a1d23;
      display: grid; place-items: center;
      transition: background 0.15s, transform 0.1s;
    }
    .mp-btn:hover { background: #fff; }
    .mp-btn:active { transform: scale(0.95); }
    .mp-btn svg { width: 20px; height: 20px; }
    .mp-btn.on { background: #2a7ae2; color: #fff; border-color: #2a7ae2; }
    #materials-body {
      width: 320px; max-width: calc(100vw - 32px);
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .mp-row { display: flex; align-items: center; gap: 10px; }
    .mp-section { display: flex; flex-direction: column; gap: 8px; }
    .mp-section-title {
      font-size: 11px; font-weight: 700; color: #5a6171;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding-bottom: 2px; border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .mp-swatch {
      width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
      border: 1px solid rgba(0,0,0,0.12);
      background-color: #c4a988;
    }
    .mp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .mp-name { font-size: 12px; font-weight: 600; color: #1a1d23; }
    .mp-controls { display: flex; gap: 6px; }
    .mp-controls input[type=color] {
      width: 36px; height: 28px; padding: 0; border: 1px solid rgba(0,0,0,0.1);
      border-radius: 4px; cursor: pointer; background: transparent; flex-shrink: 0;
    }
    .mp-controls select {
      flex: 1; min-width: 0; height: 28px; padding: 0 6px;
      font: inherit; font-size: 12px; color: #1a1d23;
      background: #fff; border: 1px solid rgba(0,0,0,0.1);
      border-radius: 4px; cursor: pointer;
    }
    .mp-reset {
      align-self: stretch; padding: 6px 12px; font: inherit; font-size: 12px;
      font-weight: 600; color: #1a1d23; background: #f0f2f7;
      border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; cursor: pointer;
    }
    .mp-reset:hover { background: #e3e6ed; }

    @media (max-width: 720px) {
      #materials-body { width: 240px; }
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>Vista 3D</h2>
    <p id="dims">Cargando...</p>
    <span class="help-wrapper">
      <span id="help" tabindex="0" aria-label="Ayuda de navegación" role="button">ⓘ</span>
      <div id="help-tooltip" role="tooltip">
        <strong>Cómo mover la vista</strong>
        <ul>
          <li><b>Arrastrar</b> (botón izquierdo) — rotar</li>
          <li><b>Scroll</b> — zoom</li>
          <li><b>Click derecho + arrastrar</b> — mover</li>
        </ul>
      </div>
    </span>
  </div>

  <a id="back" href="/" title="Volver a la página de inicio">← Volver</a>

  <div id="materials-panel">
    <button id="materials-toggle" class="mp-btn" type="button" title="Personalizar colores y texturas" aria-label="Materiales">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>
      </svg>
    </button>
    <div id="materials-body" hidden>
      <div class="mp-section">
        <div class="mp-section-title">Suelo</div>
        <div class="mp-row" data-key="suelo">
          <div class="mp-swatch" id="mp-swatch-suelo"></div>
          <div class="mp-info">
            <div class="mp-name">Cara superior</div>
            <div class="mp-controls">
              <input type="color" id="mp-suelo-color" value="#c4a988" title="Color de la cara superior del suelo">
              <select id="mp-suelo-texture" title="Textura del suelo">
                <option value="liso">Liso</option>
                <option value="madera">Madera</option>
                <option value="baldosa">Baldosa</option>
                <option value="ladrillo">Ladrillo</option>
                <option value="marmol">Mármol</option>
                <option value="piedra">Piedra</option>
              </select>
            </div>
          </div>
        </div>
        <div class="mp-row" data-key="suelo-debajo">
          <div class="mp-swatch" id="mp-swatch-suelo-debajo"></div>
          <div class="mp-info">
            <div class="mp-name">Cara inferior (forjado)</div>
            <div class="mp-controls">
              <input type="color" id="mp-suelo-debajo-color" value="#6a5a48" title="Color de la cara inferior del suelo">
              <select id="mp-suelo-debajo-texture" title="Textura del forjado">
                <option value="liso">Liso</option>
                <option value="madera">Madera</option>
                <option value="baldosa">Baldosa</option>
                <option value="ladrillo">Ladrillo</option>
                <option value="marmol">Mármol</option>
                <option value="piedra">Piedra</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="mp-section" id="mp-walls-section">
        <div class="mp-section-title">Paredes</div>
        <div id="mp-walls-list">
          <!-- Se rellena desde viewer.js: una fila por pared detectada
               (exteriores N/S/E/O + interiores con id o data-name). -->
        </div>
      </div>

      <div class="mp-section">
        <div class="mp-section-title">Cristal ventanas</div>
        <div class="mp-row" data-key="cristal">
          <div class="mp-swatch" id="mp-swatch-cristal"></div>
          <div class="mp-info">
            <div class="mp-name">Cristal (azul por defecto)</div>
            <div class="mp-controls">
              <input type="color" id="mp-cristal-color" value="#b8d8f0" title="Color del cristal">
              <select id="mp-cristal-texture" title="Textura del cristal">
                <option value="liso">Liso</option>
                <option value="madera">Madera</option>
                <option value="baldosa">Baldosa</option>
                <option value="ladrillo">Ladrillo</option>
                <option value="marmol">Mármol</option>
                <option value="piedra">Piedra</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <button type="button" id="mp-reset" class="mp-reset" title="Restablecer valores por defecto">
        Restablecer
      </button>
    </div>
  </div>

  <div id="controls">
    <button id="toggle-walls" class="toggle on" type="button" title="Mostrar u ocultar las paredes exteriores del piso">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
      </svg>
      <span>Paredes exteriores</span>
      <span class="indicator" aria-hidden="true"></span>
    </button>
    <button id="toggle-apertures" class="toggle on" type="button" title="Mostrar u ocultar puertas y ventanas en las paredes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="3" width="12" height="18" rx="1"/>
        <line x1="6" y1="11" x2="18" y2="11"/>
      </svg>
      <span>Puertas y ventanas</span>
      <span class="indicator" aria-hidden="true"></span>
    </button>
  </div>

  <div id="error" style="display:none">
    <h1>Error</h1>
    <p id="err-msg"></p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/public/viewer.js"></script>
</body>
</html>
